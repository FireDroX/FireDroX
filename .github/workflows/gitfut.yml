name: Mettre à jour l'image GitFut

on:
  workflow_dispatch:

  schedule:
    - cron: "55 17 * * *"

permissions:
  contents: write

concurrency:
  group: update-gitfut-image
  cancel-in-progress: true

jobs:
  update-image:
    runs-on: ubuntu-latest

    env:
      GITFUT_USERNAME: FireDroX
      OUTPUT_FILE: /tmp/FireDroX.png
      GITFUT_REPOSITORY: https://github.com/Younesfdj/gitfut.git

    steps:
      - name: Récupérer le dépôt principal
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Première tentative : télécharger l'image depuis gitfut.com
      - name: Essayer le serveur GitFut officiel
        id: official
        continue-on-error: true
        shell: bash
        run: |
          set -e

          rm -f "${OUTPUT_FILE}.tmp"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            "https://gitfut.com/${GITFUT_USERNAME}.png" \
            --output "${OUTPUT_FILE}.tmp"

          MIME_TYPE="$(file --brief --mime-type "${OUTPUT_FILE}.tmp")"

          if [ "$MIME_TYPE" != "image/png" ]; then
            echo "Le serveur officiel n'a pas retourné une image PNG."
            echo "Type reçu : $MIME_TYPE"

            rm -f "${OUTPUT_FILE}.tmp"
            exit 1
          fi

          mv "${OUTPUT_FILE}.tmp" "$OUTPUT_FILE"

          echo "Image récupérée depuis le serveur officiel."

      # Solution de secours : lancer GitFut localement
      - name: Cloner GitFut en secours
        if: steps.official.outcome == 'failure'
        shell: bash
        run: |
          rm -rf /tmp/gitfut

          git clone \
            --depth 1 \
            "$GITFUT_REPOSITORY" \
            /tmp/gitfut

      - name: Installer Node.js
        if: steps.official.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installer et compiler GitFut
        if: steps.official.outcome == 'failure'
        working-directory: /tmp/gitfut
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build

      - name: Démarrer GitFut localement
        if: steps.official.outcome == 'failure'
        working-directory: /tmp/gitfut
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
        run: |
          npm start > /tmp/gitfut.log 2>&1 &

          echo $! > /tmp/gitfut.pid

          for attempt in {1..45}; do
            if curl \
              --fail \
              --silent \
              --output /dev/null \
              "http://127.0.0.1:3000/"
            then
              echo "GitFut est démarré."
              exit 0
            fi

            echo "Attente du serveur GitFut : tentative ${attempt}/45"
            sleep 2
          done

          echo "Impossible de démarrer GitFut."
          cat /tmp/gitfut.log
          exit 1

      - name: Générer l'image avec GitFut local
        if: steps.official.outcome == 'failure'
        shell: bash
        run: |
          set -e

          rm -f "${OUTPUT_FILE}.tmp"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-time 120 \
            "http://127.0.0.1:3000/${GITFUT_USERNAME}.png" \
            --output "${OUTPUT_FILE}.tmp"

          MIME_TYPE="$(file --brief --mime-type "${OUTPUT_FILE}.tmp")"

          if [ "$MIME_TYPE" != "image/png" ]; then
            echo "La génération locale n'a pas produit de PNG."
            echo "Type reçu : $MIME_TYPE"

            cat /tmp/gitfut.log

            rm -f "${OUTPUT_FILE}.tmp"
            exit 1
          fi

          mv "${OUTPUT_FILE}.tmp" "$OUTPUT_FILE"

          echo "Image générée localement."

      - name: Arrêter le serveur GitFut local
        if: always() && steps.official.outcome == 'failure'
        shell: bash
        run: |
          if [ -f /tmp/gitfut.pid ]; then
            kill "$(cat /tmp/gitfut.pid)" 2>/dev/null || true
          fi

      - name: Publier uniquement l'image sur la branche gitfut
        shell: bash
        run: |
          set -e

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "Erreur : l'image générée est introuvable."
            exit 1
          fi

          MIME_TYPE="$(file --brief --mime-type "$OUTPUT_FILE")"

          if [ "$MIME_TYPE" != "image/png" ]; then
            echo "Erreur : le fichier final n'est pas un PNG."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote \
            --exit-code \
            --heads origin gitfut \
            > /dev/null 2>&1
          then
            echo "Récupération de la branche gitfut existante."

            git fetch origin gitfut
            git switch --force-create gitfut origin/gitfut
          else
            echo "Création de la branche orpheline gitfut."

            git switch --orphan gitfut
          fi

          # Supprime tous les fichiers présents dans la branche
          git rm -rf --ignore-unmatch .
          git clean -fdx

          # La branche ne contiendra que ce fichier
          cp "$OUTPUT_FILE" ./FireDroX.png

          git add -A

          if git diff --cached --quiet; then
            echo "L'image n'a pas changé."
            exit 0
          fi

          git commit -m "chore: update GitFut image"
          git push --set-upstream origin gitfut
